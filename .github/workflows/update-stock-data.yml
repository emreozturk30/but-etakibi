name: Hisse Senedi Verilerini Güncelle

on:
  schedule:
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Deponun varsayılan dalı main değil (claude/budget-tracking-app-aqvdjl);
      # schedule tetiklemeli çalıştırmalar varsayılan dalı kullanır, bu yüzden
      # ref burada açıkça main olarak sabitleniyor.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-stock-data.mjs

      # GITHUB_TOKEN ile atılan push'lar GitHub'ın döngü-önleme kuralı
      # gereği diğer workflow'ları (deploy.yml'nin push tetikleyicisi dahil)
      # otomatik tetiklemiyor, bu yüzden veri değiştiyse deploy'u elle
      # tetikliyoruz.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stock-data.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Hisse senedi verilerini güncelle"
            git push
            gh workflow run deploy.yml --ref main
          fi
