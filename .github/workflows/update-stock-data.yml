name: Hisse Senedi Verilerini Güncelle

on:
  schedule:
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-stock-data.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stock-data.json
          git diff --staged --quiet || git commit -m "Hisse senedi verilerini güncelle"
          git push
